{% extends "base.html" %}

{% block title %}写新文章{% endblock %}

{% block content %}
<h1>写新文章</h1>

<form method="post">
    <label>
        标题：<br>
        <input type="text" name="title" style="width:100%;" required>
    </label>
    <br><br>
    <label>
        内容：<br>
        <textarea name="content" rows="8" style="width:100%;" required></textarea>
    </label>
    <br>
    <button type="submit">发布</button>
    <a href="{{ url_for('blog.index') }}">返回</a>
</form>
{% endblock %}
