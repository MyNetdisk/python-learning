{% extends "base.html" %}

{% block title %}博客{% endblock %}

{% block content %}
<h1>博客文章</h1>
<p><a href="{{ url_for('blog.add') }}">写新文章</a></p>

{% if posts %}
{% for post in posts %}
<article style="border-bottom:1px solid #ccc; padding:12px 0;">
    <h2>{{ post.title }}</h2>
    <p>{{ post.content }}</p>
    <p>
        <a href="{{ url_for('blog.edit', post_id=post.id) }}">编辑</a>
        <form method="post" action="{{ url_for('blog.delete', post_id=post.id) }}" style="display:inline;" onsubmit="return confirm('确定删除？');">
            <button type="submit">删除</button>
        </form>
    </p>
</article>
{% endfor %}
{% else %}
<p>还没有文章，去写一篇吧！</p>
{% endif %}
{% endblock %}
